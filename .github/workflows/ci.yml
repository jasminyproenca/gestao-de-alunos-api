name: Pipeline de Testes

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Instalar Dependências
      run: npm ci

    - name: Configurar Variáveis de Ambiente (.env)
      run: |
        echo "PORT=3000" > .env
        echo "ADMIN_EMAIL=admin@escola.com" >> .env
        echo "ADMIN_SENHA=admin123" >> .env
        echo "JWT_SECRET=secret" >> .env
        echo "JWT_EXPIRES_IN=1h" >> .env

    - name: Executar os Testes Automatizados (Mocha/Chai/SuperTest)
      run: npm test
