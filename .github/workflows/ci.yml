name: Pipeline de Testes

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Instalar Dependências
      run: npm ci

    - name: Configurar Variáveis de Ambiente (.env)
      run: cp .env.example .env

    - name: Executar os Testes Automatizados (Mocha/Chai/SuperTest)
      run: npm test
